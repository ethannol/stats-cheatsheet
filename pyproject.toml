[project]
name = "stats-cheatsheet"
version = "0.1.0"
description = "Statistics cheat sheet: runnable, annotated examples of general statistical methods on environmental data (NOAA, NASA, USGS) and of the methods specific to mining practice (resource estimation, QA/QC, geochemistry, sampling theory, reliability, safety, economics, environmental compliance)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pyarrow>=17",
    "rdata>=0.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "jupytext>=1.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statsheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.ruff.lint.per-file-ignores]
# tutorial scripts: long f-string print lines are deliberate
"analyses/*" = ["E501"]
